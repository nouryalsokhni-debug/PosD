<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantara · Cashier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/pos.css">
  <!-- Apply the saved language before first paint (same key as the control panel) -->
  <script>try{var l=localStorage.getItem("quantara.lang");if(l==="ar"){document.documentElement.lang="ar";document.documentElement.dir="rtl";}}catch(e){}</script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast-region" role="status" aria-live="polite"></div>
  <div id="print-root" aria-hidden="true"></div>

  <!-- Plain scripts, in dependency order. No modules, no build: opens from the file system. -->
  <script src="js/pos-data.js"></script>
  <script src="js/pos-i18n.js"></script>
  <script src="js/pos-store.js"></script>
  <script src="js/pos-more.js"></script>
  <script src="js/pos-print.js"></script>
  <script src="js/pos-offline.js"></script>
  <script src="js/pos-app.js"></script>
</body>
</html>
