<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantara · Control panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/ops.css">
  <!-- Apply the saved language before first paint so the page never flips direction on load -->
  <script>try{var l=localStorage.getItem("quantara.lang");if(l==="ar"){document.documentElement.lang="ar";document.documentElement.dir="rtl";}}catch(e){}</script>
</head>

  <div id="app"></div>
  <div id="toast" class="toast-region" role="status" aria-live="polite"></div>

  <!-- Plain scripts, in dependency order. No modules, no build: opens from the file system. -->
  <script src="js/data.js"></script>
  <script src="js/data-ops.js"></script>
  <script src="js/data-billing.js"></script>
  <script src="js/i18n.js"></script>
